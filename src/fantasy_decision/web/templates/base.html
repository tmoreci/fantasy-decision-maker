<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Start Who?</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
  {# Vendored rather than loaded from a CDN, so the app has no third-party runtime dependency. #}
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico-2.1.1.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx-2.0.4.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <main class="container">
    <header class="masthead">
      <h1>Start Who?</h1>
      <p>Can't decide who to start? Pick two or three players and we'll tell you who, and how sure we are.</p>
    </header>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
