[project]
name = "fantasy-decision-maker"
version = "0.1.0"
description = "Decide who to start in your fantasy football matchup, using TypeSafe AI's Jev System One model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pydantic>=2.12.0",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# nflverse pulls pandas/pyarrow. Kept optional so the core CLI installs light;
# the advanced-usage provider degrades to "unavailable" when it is missing.
advanced = ["nfl_data_py>=0.3.2", "pandas>=2.0"]
# The hosted web app: FastAPI JSON API plus HTMX pages.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "respx>=0.21", "fantasy-decision-maker[web]"]

[project.scripts]
start-who = "fantasy_decision.cli:main"
start-who-web = "fantasy_decision.web.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fantasy_decision"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
